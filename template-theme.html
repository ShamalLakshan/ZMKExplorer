            { tap: '▽', raw: '&trans', type: 'trans' }, { tap: '▽', raw: '&trans', type: 'trans' }, { tap: '▽', raw: '&trans', type: 'trans' }, { tap: '▽', raw: '&trans', type: 'trans' }, { tap: '▽', raw: '&trans', type: 'trans' },
            { tap: 'PgUp', raw: '&kp PG_UP', type: 'kp' }, { tap: 'Home', raw: '&kp HOME', type: 'kp' }, { tap: '↑', raw: '&kp UP', type: 'kp' }, { tap: 'End', raw: '&kp END', type: 'kp' }, { tap: 'Del', raw: '&kp DEL', type: 'kp' },
            { tap: 'Ctrl', raw: '&kp LCTRL', type: 'mod' }, { tap: 'Alt', raw: '&kp LALT', type: 'mod' }, { tap: 'Super', raw: '&kp LGUI', type: 'mod' }, { tap: 'Shift', raw: '&kp LSHFT', type: 'mod' }, { tap: '▽', raw: '&trans', type: 'trans' },
            { tap: 'PgDn', raw: '&kp PG_DN', type: 'kp' }, { tap: '←', raw: '&kp LEFT', type: 'kp' }, { tap: '↓', raw: '&kp DOWN', type: 'kp' }, { tap: '→', raw: '&kp RIGHT', type: 'kp' }, { tap: 'Bksp', raw: '&kp BSPC', type: 'kp' },
            { tap: 'Undo', raw: '&kp LG(Z)', type: 'sys' }, { tap: 'Cut', raw: '&kp LG(X)', type: 'sys' }, { tap: 'Copy', raw: '&kp LG(C)', type: 'sys' }, { tap: 'Paste', raw: '&kp LG(V)', type: 'sys' }, { tap: '▽', raw: '&trans', type: 'trans' },
            { tap: '▽', raw: '&trans', type: 'trans' }, { tap: 'Tab', raw: '&kp TAB', type: 'kp' }, { tap: '▽', raw: '&trans', type: 'trans' }, { tap: '▽', raw: '&trans', type: 'trans' }, { tap: '▽', raw: '&trans', type: 'trans' },
            { tap: '▽', raw: '&trans', type: 'trans' }, { tap: '▽', raw: '&trans', type: 'trans' }, { tap: '▽', raw: '&trans', type: 'trans' },
            { tap: '▽', raw: '&trans', type: 'trans' }, { tap: 'Func', raw: '&mo 3', type: 'layer', hold: 'MO', targetLayer: 3 }, { tap: 'HELD', raw: '&mo 2', type: 'held' }
          ]
        },
        {
          id: 3, name: 'func', encoderText: 'encoders: bri± | vol±',
          keys: [
            { tap: 'F1', raw: '&kp F1', type: 'kp' }, { tap: 'F2', raw: '&kp F2', type: 'kp' }, { tap: 'F3', raw: '&kp F3', type: 'kp' }, { tap: 'F4', raw: '&kp F4', type: 'kp' }, { tap: 'F5', raw: '&kp F5', type: 'kp' },
            { tap: 'F6', raw: '&kp F6', type: 'kp' }, { tap: 'F7', raw: '&kp F7', type: 'kp' }, { tap: 'F8', raw: '&kp F8', type: 'kp' }, { tap: 'F9', raw: '&kp F9', type: 'kp' }, { tap: 'F10', raw: '&kp F10', type: 'kp' },
            { tap: 'Bri-', raw: '&kp C_BRI_DN', type: 'sys' }, { tap: 'Bri+', raw: '&kp C_BRI_UP', type: 'sys' }, { tap: 'Prev', raw: '&kp C_PREV', type: 'sys' }, { tap: 'Play', raw: '&kp C_PP', type: 'sys' }, { tap: 'Next', raw: '&kp C_NEXT', type: 'sys' },
            { tap: 'Mute', raw: '&kp C_MUTE', type: 'sys' }, { tap: 'Vol-', raw: '&kp C_VOL_DN', type: 'sys' }, { tap: 'Vol+', raw: '&kp C_VOL_UP', type: 'sys' }, { tap: 'F11', raw: '&kp F11', type: 'kp' }, { tap: 'F12', raw: '&kp F12', type: 'kp' },
            { tap: '▽', raw: '&trans', type: 'trans' }, { tap: '▽', raw: '&trans', type: 'trans' }, { tap: '▽', raw: '&trans', type: 'trans' }, { tap: '▽', raw: '&trans', type: 'trans' }, { tap: '▽', raw: '&trans', type: 'trans' },
            { tap: '▽', raw: '&trans', type: 'trans' }, { tap: '▽', raw: '&trans', type: 'trans' }, { tap: '▽', raw: '&trans', type: 'trans' }, { tap: '▽', raw: '&trans', type: 'trans' }, { tap: 'Sett', raw: '&tog 4', type: 'layer', hold: 'TOG', targetLayer: 4 },
            { tap: '▽', raw: '&trans', type: 'trans' }, { tap: '▽', raw: '&trans', type: 'trans' }, { tap: '▽', raw: '&trans', type: 'trans' },
            { tap: '▽', raw: '&trans', type: 'trans' }, { tap: 'HELD', raw: '&mo 1', type: 'held' }, { tap: 'HELD', raw: '&mo 2', type: 'held' }
          ]
        },
        {
          id: 4, name: 'sett', encoderText: 'encoders: disabled',
          keys: [
            { tap: 'BT0', raw: '&bt BT_SEL 0', type: 'sys' }, { tap: 'BT1', raw: '&bt BT_SEL 1', type: 'sys' }, { tap: 'BT2', raw: '&bt BT_SEL 2', type: 'sys' }, { tap: 'BT3', raw: '&bt BT_SEL 3', type: 'sys' }, { tap: 'Clr', raw: '&bt BT_CLR', type: 'sys' },
            { tap: 'RGB', raw: '&rgb_ug RGB_TOG', type: 'sys' }, { tap: 'Hue+', raw: '&rgb_ug RGB_HUI', type: 'sys' }, { tap: 'Sat+', raw: '&rgb_ug RGB_SAI', type: 'sys' }, { tap: 'Bri+', raw: '&rgb_ug RGB_BRI', type: 'sys' }, { tap: 'Eff', raw: '&rgb_ug RGB_EFF', type: 'sys' },
            { tap: 'USB', raw: '&out OUT_USB', type: 'sys' }, { tap: 'BLE', raw: '&out OUT_BLE', type: 'sys' }, { tap: '▽', raw: '&trans', type: 'trans' }, { tap: '▽', raw: '&trans', type: 'trans' }, { tap: '▽', raw: '&trans', type: 'trans' },
            { tap: '▽', raw: '&trans', type: 'trans' }, { tap: '▽', raw: '&trans', type: 'trans' }, { tap: '▽', raw: '&trans', type: 'trans' }, { tap: '▽', raw: '&trans', type: 'trans' }, { tap: '▽', raw: '&trans', type: 'trans' },
            { tap: 'Boot', raw: '&bootloader', type: 'sys' }, { tap: 'Rst', raw: '&sys_reset', type: 'sys' }, { tap: '▽', raw: '&trans', type: 'trans' }, { tap: '▽', raw: '&trans', type: 'trans' }, { tap: '▽', raw: '&trans', type: 'trans' },
            { tap: '▽', raw: '&trans', type: 'trans' }, { tap: '▽', raw: '&trans', type: 'trans' }, { tap: '▽', raw: '&trans', type: 'trans' }, { tap: '▽', raw: '&trans', type: 'trans' }, { tap: 'Base', raw: '&to 0', type: 'layer', hold: 'TO', targetLayer: 0 },
            { tap: '▽', raw: '&trans', type: 'trans' }, { tap: '▽', raw: '&trans', type: 'trans' }, { tap: '▽', raw: '&trans', type: 'trans' },
            { tap: '▽', raw: '&trans', type: 'trans' }, { tap: '▽', raw: '&trans', type: 'trans' }, { tap: '▽', raw: '&trans', type: 'trans' }
          ]
        }
      ];

      const COMBOS = [
        { id: 'tab',    label: '⇥ Tab',    positions: [0, 1],   arcOffset: -20, anchorDy: -18 },
        { id: 'bksp',   label: '⌫ Bksp',   positions: [12, 13], arcOffset: -18, anchorDy: -18 },
        { id: 'enter',  label: '↵ Enter',  positions: [16, 17], arcOffset: -18, anchorDy: -18 },
        { id: 'home',   label: 'Home',     positions: [10, 11], arcOffset: -18, anchorDy: -18 },
        { id: 'end',    label: 'End',      positions: [18, 19], arcOffset: -18, anchorDy: -18 },
        { id: 'alt',    label: 'Alt',      positions: [20, 21], arcOffset: -18, anchorDy: 22 },
        { id: 'cbksp',  label: 'C-⌫ Bksp', positions: [22, 23], arcOffset: -18, anchorDy: 22 },
        { id: 'quote',  label: "'",        positions: [27, 28], arcOffset: -18, anchorDy: 22 },
        { id: 'esc',    label: 'Esc',      positions: [0, 2],   arcOffset: -38, anchorDy: -22 },
        { id: 'capsw',  label: 'CapsW',    positions: [14, 15], arcOffset: -26, anchorDx: [18, -18], anchorDy: 0 }
      ];

      let activeLayer = 0;
      const unitSize = 62;
      let showAllChords = true;
      let hoveredComboId = null;
      let searchQuery = '';

      function getKeyCoords(pos) {
        const kp = KEY_POSITIONS.find(k => k.pos === pos);
        const gap = 6;
        const w = unitSize - gap, h = unitSize - gap;
        const left = kp.x * unitSize, top = kp.y * unitSize;
        return { left, top, w, h, cx: left + w / 2, cy: top + h / 2 };
      }

      function renderLayerTabs() {
        const tablist = document.getElementById('layer-tablist');
        tablist.innerHTML = '';
        LAYERS.forEach((layer, idx) => {
          const isActive = idx === activeLayer;
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.role = 'tab';
          btn.setAttribute('aria-selected', String(isActive));
          btn.className = isActive
            ? 'px-3 py-1 rounded-full bg-accent text-on-accent font-mono text-mono-sm transition-colors'
            : 'px-3 py-1 rounded-full text-text-muted hover:text-on-surface font-mono text-mono-sm transition-colors';
          btn.textContent = `${idx + 1} ${layer.name}`;
          btn.addEventListener('click', () => switchLayer(idx));
          tablist.appendChild(btn);
        });
      }

      function switchLayer(idx) {
        if (idx === activeLayer) return;
        activeLayer = idx;
        playKeySound('layer');
        document.getElementById('stage-layer-title').textContent = `layer ${idx} · ${LAYERS[idx].name}`;
        document.getElementById('encoder-status-text').textContent = LAYERS[idx].encoderText;
        renderAll();
      }

      function renderKeyboard() {
        const layer = LAYERS[activeLayer];
        const canvas = document.getElementById('keyboard-canvas');
        const keysLayer = document.getElementById('keys-layer');
        canvas.style.width = `${13.2 * unitSize}px`;
        canvas.style.height = `${5.3 * unitSize}px`;
        keysLayer.innerHTML = '';

        const highlighted = new Set();
        if (hoveredComboId) {
          const c = COMBOS.find(x => x.id === hoveredComboId);
          if (c) c.positions.forEach(p => highlighted.add(p));
        }

        KEY_POSITIONS.forEach((kp) => {
          const keyObj = layer.keys[kp.pos];
          const coords = getKeyCoords(kp.pos);
          const isMatch = searchQuery.trim() && (keyObj.tap.toLowerCase().includes(searchQuery.toLowerCase()) || keyObj.raw.toLowerCase().includes(searchQuery.toLowerCase()));

          let cls = 'keycap-3d absolute flex flex-col items-center justify-center rounded border cursor-pointer select-none px-1 ';
          if (keyObj.type === 'layer') cls += 'bg-layer-bg border-layer-border text-on-layer-bg ';
          else if (keyObj.type === 'mod') cls += 'bg-mod-bg border-mod-border text-on-mod-bg ';
          else if (keyObj.type === 'sys') cls += 'bg-sys-bg border-sys-border text-on-sys-bg ';
          else if (keyObj.type === 'trans') cls += 'bg-transparent border-dashed border-border-strong text-text-muted ';
          else if (keyObj.type === 'held') cls += 'bg-accent-soft border-accent text-accent-text ';
          else cls += 'bg-key-bg border-border text-on-key-bg ';

          if (highlighted.has(kp.pos)) cls += 'is-combo-active ';
          if (isMatch) cls += 'is-search-match ';

          const btn = document.createElement('button');
          btn.type = 'button';
          btn.style.left = `${coords.left}px`;
          btn.style.top = `${coords.top}px`;
          btn.style.width = `${coords.w}px`;
          btn.style.height = `${coords.h}px`;
          btn.className = cls;
          btn.innerHTML = `
            <span class="font-mono font-bold ${keyObj.tap.length > 4 ? 'text-[10.5px]' : 'text-[13px]'} leading-tight">${keyObj.tap}</span>
            ${keyObj.hold ? `<span class="font-mono text-[9px] px-1.5 py-px rounded-sm bg-bg/40 mt-0.5">${keyObj.hold}</span>` : ''}
          `;
          btn.addEventListener('mouseenter', () => inspectKey(kp.pos, keyObj));
          btn.addEventListener('click', () => {
            playKeySound('key');
            inspectKey(kp.pos, keyObj);
            if (keyObj.targetLayer !== undefined) switchLayer(keyObj.targetLayer);
          });
          keysLayer.appendChild(btn);
        });

        ENCODERS.forEach((enc) => {
          const encSize = unitSize * 0.96;
          const knob = document.createElement('button');
          knob.type = 'button';
          knob.style.left = `${enc.x * unitSize}px`;
          knob.style.top = `${enc.y * unitSize}px`;
          knob.style.width = `${encSize}px`;
          knob.style.height = `${encSize}px`;
          knob.className = 'encoder-knob absolute rounded-full border border-accent/40 flex flex-col items-center justify-center text-on-surface cursor-pointer';
          knob.innerHTML = `
            <span class="w-1 h-2 rounded-full bg-accent mb-0.5"></span>
            <span class="font-mono text-[11px] font-bold text-accent-text leading-none">${enc.label}</span>
            <span class="font-mono text-[8px] text-text-muted leading-none mt-0.5">${enc.sub}</span>
          `;
          knob.addEventListener('click', () => { playKeySound('key'); inspectKey(enc.pos, { tap: enc.label, raw: enc.raw, type: 'sys', hold: enc.sub }); });
          keysLayer.appendChild(knob);
        });
      }

      function renderComboOverlay() {
        const svg = document.getElementById('combos-svg');
        const pills = document.getElementById('combos-pills-layer');
        svg.innerHTML = '';
        pills.innerHTML = '';

        const activeCombos = COMBOS.filter(c => hoveredComboId ? c.id === hoveredComboId : showAllChords);
        activeCombos.forEach((combo) => {
          const p1 = getKeyCoords(combo.positions[0]);
          const p2 = getKeyCoords(combo.positions[1]);
          const dx1 = combo.anchorDx ? combo.anchorDx[0] : 0;
          const dx2 = combo.anchorDx ? combo.anchorDx[1] : 0;
          const dy = combo.anchorDy || 0;
          const ax1 = p1.cx + dx1, ay1 = p1.cy + dy;
          const ax2 = p2.cx + dx2, ay2 = p2.cy + dy;
          const midX = (ax1 + ax2) / 2, midY = (ay1 + ay2) / 2 + combo.arcOffset;

          const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          path.setAttribute('d', `M ${ax1} ${ay1} Q ${midX} ${midY} ${ax2} ${ay2}`);
          path.setAttribute('fill', 'none');
          path.setAttribute('stroke', '#f97316');
          path.setAttribute('stroke-width', hoveredComboId === combo.id ? '2.5' : '1.75');
          path.setAttribute('stroke-dasharray', '4 3');
          svg.appendChild(path);

          const pillX = 0.25 * ax1 + 0.5 * midX + 0.25 * ax2;
          const pillY = 0.25 * ay1 + 0.5 * midY + 0.25 * ay2;
          const pill = document.createElement('div');
          pill.style.left = `${pillX}px`;
          pill.style.top = `${pillY}px`;
          pill.className = 'absolute -translate-x-1/2 -translate-y-1/2 px-2 py-0.5 rounded-full bg-surface border border-accent text-accent-text font-mono text-[10px] font-bold shadow-md whitespace-nowrap';
          pill.textContent = combo.label;
          pills.appendChild(pill);
        });
      }

      function inspectKey(pos, keyObj) {
        document.getElementById('inspector-pos-badge').textContent = `${LAYERS[activeLayer].name} · pos ${pos}`;
        document.getElementById('inspector-raw').textContent = keyObj.raw;
        document.getElementById('inspector-taphold').textContent = keyObj.hold ? `${keyObj.tap} / ${keyObj.hold}` : keyObj.tap;
        document.getElementById('inspector-behavior').textContent = keyObj.type === 'layer' ? `momentary layer (${keyObj.tap})` : `key press (${keyObj.tap})`;
      }

      function renderCombosList() {
        const list = document.getElementById('combo-chips-list');
        list.innerHTML = '';
        COMBOS.forEach((combo) => {
          const chip = document.createElement('button');
          chip.type = 'button';
          chip.className = 'inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-surface-2/80 border border-border hover:border-accent font-mono text-mono-sm text-on-surface transition-colors';
          chip.innerHTML = `<span>${combo.label}</span><span class="text-text-muted">[${combo.positions.join('+')}]</span>`;
          chip.addEventListener('mouseenter', () => { hoveredComboId = combo.id; renderKeyboard(); renderComboOverlay(); });
          chip.addEventListener('mouseleave', () => { hoveredComboId = null; renderKeyboard(); renderComboOverlay(); });
          list.appendChild(chip);
        });
      }

      function renderAll() {
        renderLayerTabs();
        renderKeyboard();
        renderComboOverlay();
        renderCombosList();
      }

      document.querySelectorAll('#mode-tablist [data-mode]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const mode = btn.getAttribute('data-mode');
          playKeySound('layer');
          document.querySelectorAll('#mode-tablist [data-mode]').forEach((b) => {
            const active = b.getAttribute('data-mode') === mode;
            b.setAttribute('aria-selected', String(active));
            b.className = active
              ? 'inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-accent text-on-accent font-mono text-mono-sm transition-colors'
              : 'inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-text-muted hover:text-on-surface font-mono text-mono-sm transition-colors';
          });
          const quizStrip = document.getElementById('zen-quiz-strip');
          quizStrip.classList.toggle('hidden', mode !== 'quiz');
          quizStrip.classList.toggle('flex', mode === 'quiz');
          if (mode === 'combos') {
            showAllChords = true;
            renderComboOverlay();
          }
        });
      });

      document.getElementById('key-search-input').addEventListener('input', (e) => { searchQuery = e.target.value; renderKeyboard(); });
      document.getElementById('btn-show-all-chords').addEventListener('click', (e) => {
        showAllChords = !showAllChords;
        e.currentTarget.setAttribute('aria-pressed', String(showAllChords));
        renderComboOverlay();
      });
      document.getElementById('btn-toggle-sound').addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        document.getElementById('sound-icon').textContent = soundEnabled ? 'volume_up' : 'volume_off';
      });
      document.addEventListener('keydown', (e) => {
        if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
        const n = Number(e.key);
        if (n >= 1 && n <= LAYERS.length) switchLayer(n - 1);
      });

      renderAll();
      inspectKey(31, LAYERS[0].keys[31]);
    })();
  </script>
